name: Build AMADORA IPA

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label (macos-26-intel when the arm64 runners have no capacity)
        default: macos-26

jobs:
  build:
    # Upstream builds on a private self-hosted Mac; this uses GitHub's hosted macOS runner instead
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Makefile requires a JDK 8 javac to build the launcher's Java side
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build tools
        run: brew install ldid make ant autoconf automake libtool

      # Signed in-bundle libjnidispatch for JNA 5.17.0; the payload step copies Natives/build/*.dylib into Frameworks
      - name: Build libjnidispatch for iOS
        run: |
          git clone --depth 1 -b 5.17.0 https://github.com/java-native-access/jna "$RUNNER_TEMP/jna"
          bash tools/build_jnidispatch_ios.sh "$RUNNER_TEMP/jna" Natives/build/libjnidispatch.dylib

      # Distant Horizons' relocated zstd-jni; DH falls back to System.loadLibrary, which searches Frameworks
      - name: Build zstd-jni (Distant Horizons) for iOS
        run: |
          git clone --depth 1 -b v1.5.7-12 https://github.com/luben/zstd-jni "$RUNNER_TEMP/zstd-jni"
          bash tools/build_zstd_jni_ios.sh "$RUNNER_TEMP/zstd-jni" Natives/build/libzstd-jni_dh-1.5.7-12.dylib

      # Distant Horizons' relocated sqlite-jdbc; DH searches java.library.path (which includes Frameworks) for it
      - name: Build sqlite-jdbc (Distant Horizons) for iOS
        run: |
          git clone --depth 1 -b 3.53.2.1 https://github.com/xerial/sqlite-jdbc "$RUNNER_TEMP/sqlite-jdbc"
          bash tools/build_sqlite_jdbc_ios.sh "$RUNNER_TEMP/sqlite-jdbc" Natives/build/libsqlitejdbc.dylib

      # SDL3 for Controlify's controller support; JavaLauncher points it at Frameworks/libSDL3.dylib
      - name: Build SDL3 (Controlify) for iOS
        run: |
          git clone --depth 1 -b release-3.4.14 https://github.com/libsdl-org/SDL "$RUNNER_TEMP/SDL"
          bash tools/build_sdl3_ios.sh "$RUNNER_TEMP/SDL" Natives/build/libSDL3.dylib

      # Current OSMesa + Zink, replacing the bundled Mesa 21.0 whose Zink cannot run Minecraft 26.x's shaders
      - name: Cache Mesa for iOS
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: Natives/build/mesa
          key: mesa-25.0.7-mvk-1.2.9-${{ hashFiles('tools/build_mesa_ios.sh') }}

      - name: Build Mesa for iOS
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        run: |
          brew install bison flex
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          python3 -m venv "$RUNNER_TEMP/mesa-venv"
          . "$RUNNER_TEMP/mesa-venv/bin/activate"
          pip install meson ninja mako pyyaml packaging
          git clone --depth 1 -b mesa-25.0.7 https://gitlab.freedesktop.org/mesa/mesa.git "$RUNNER_TEMP/mesa"
          git clone --depth 1 -b v1.2.9 https://github.com/KhronosGroup/MoltenVK "$RUNNER_TEMP/MoltenVK"
          bash tools/build_mesa_ios.sh "$RUNNER_TEMP/mesa" "$RUNNER_TEMP/MoltenVK" Natives/build/mesa

      - name: Use Mesa for iOS
        run: cp Natives/build/mesa/*.dylib Natives/build/

      - name: Build IPA
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          gmake -j$(sysctl -n hw.ncpu) package BOOTJDK="$JAVA_HOME/bin" RELEASE=1

      - name: Name IPA
        run: mv artifacts/org.angelauramc.amethyst-*-ios.ipa artifacts/AMADORA_V0.2.ipa

      # Full IPA bundles Java 8, 17, 21 and 25 (Minecraft 1.8 through 26.x)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AMADORA_V0.2
          path: artifacts/AMADORA_V0.2.ipa
